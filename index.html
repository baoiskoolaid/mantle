<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Docs</title>
<link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
<style>
html, body { margin:0; height:100%; background:#09090b; overflow:hidden;
font-family:Arial, Helvetica, sans-serif; }
#loader { position:fixed; inset:0; display:flex; flex-direction:column;
align-items:center; justify-content:center; gap:22px; transition:opacity .25s ease; }
#loader img { width:220px; max-width:70vw; pointer-events:none; opacity:.95; }
.wordmark { display:none; color:#fafafa; font-weight:700; font-size:17px;
letter-spacing:.45em; text-indent:.45em; }
.bar { width:130px; height:2px; border-radius:2px; overflow:hidden;
background:rgba(255,255,255,.08); }
.bar i { display:block; width:40%; height:100%; border-radius:2px;
background:rgba(255,255,255,.5); animation:slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(330%); } }
#error { position:fixed; inset:0; display:none; flex-direction:column;
align-items:center; justify-content:center; padding:28px; text-align:center;
overflow:auto; box-sizing:border-box; background:#09090b; }
#error img { width:190px; max-width:60vw; opacity:.9; margin-bottom:22px; }
#error h1 { color:#fafafa; font-size:15px; font-weight:700; margin:0 0 8px; }
#error .reason { color:#a1a1aa; font-size:12.5px; line-height:1.6;
max-width:460px; margin:0 0 16px; }
#error pre { color:#71717a; font:11px/1.7 monospace; text-align:left;
white-space:pre-wrap; background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.07); border-radius:8px;
padding:12px 14px; max-width:540px; margin:0 0 18px; }
#error button { background:#fff; color:#000; border:0; border-radius:6px;
padding:9px 24px; font:600 13px Arial; cursor:pointer; }
#error button:hover { background:#e4e4e7; }
#frame { position:fixed; inset:0; width:100%; height:100%; border:0;
display:none; background:#000; }
</style>
</head>
<body>
<div id="loader">
<img src="https://mantleassets.vercel.app/full%20logo.png" alt="" draggable="false">
<span class="wordmark" id="loaderWordmark">MANTLE</span>
<div class="bar"><i></i></div>
</div>

<div id="error">
<img src="https://mantleassets.vercel.app/full%20logo.png" alt="" draggable="false"
onerror="this.style.display='none';document.getElementById('errWordmark').style.display='block'">
<span class="wordmark" id="errWordmark">MANTLE</span>
<h1>Mantle couldn't load</h1>
<p class="reason" id="reason"></p>
<pre id="detail"></pre>
<button id="retry">Retry now</button>
</div>

<iframe id="frame" referrerpolicy="no-referrer"
allow="fullscreen; pointer-lock; gamepad; autoplay; clipboard-read; clipboard-write; camera; microphone"></iframe>

<script>
const CONFIG = {
  SOURCES: [
    "https://raw.githubusercontent.com/dobberr/mantle-menu/main/index.html",
    "https://cdn.jsdelivr.net/gh/dobberr/mantle-menu@main/index.html",
    "https://raw.githack.com/dobberr/mantle-menu/main/index.html",
    "https://cdn.statically.io/gh/dobberr/mantle-menu/main/index.html"
  ],
  BASE_HREF: "https://cdn.jsdelivr.net/gh/dobberr/mantle-menu"
};

const loader = document.getElementById("loader");
const error = document.getElementById("error");
const frame = document.getElementById("frame");
const reason = document.getElementById("reason");
const detail = document.getElementById("detail");
const retry = document.getElementById("retry");

async function loadHub() {
  loader.style.display = "flex";
  error.style.display = "none";
  frame.style.display = "none";

  let lastError = null;

  for (const source of CONFIG.SOURCES) {
    try {
      const response = await fetch(source, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      let html = await response.text();

      if (CONFIG.BASE_HREF) {
        html = html.replace(/<head([^>]*)>/i,
          `<head$1><base href="${CONFIG.BASE_HREF}/">`);
      }

      const blob = new Blob([html], { type: "text/html" });
      frame.src = URL.createObjectURL(blob);

      frame.onload = () => {
        loader.style.opacity = "0";
        setTimeout(() => loader.style.display = "none", 250);
        frame.style.display = "block";
      };
      return;
    } catch (err) {
      lastError = err;
    }
  }

  loader.style.display = "none";
  reason.textContent = "The Mantle hub could not be loaded from any available source.";
  detail.textContent = lastError ? String(lastError) : "Unknown error";
  error.style.display = "flex";
}

retry.addEventListener("click", loadHub);
loadHub();
</script>
</body>
</html>
